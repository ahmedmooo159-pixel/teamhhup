<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeamHub</title>
  <link rel="icon" href="assets/logo/logo-symbol.png">

  <!-- Only external resource: Google Fonts (system fonts are the fallback). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The viewport letterboxes a fixed 1920x1080 stage. No header, no footer. -->
  <div id="viewport">
    <main id="stage" aria-live="polite">
      <div id="camera">

        <!-- Background: base, navy reveal layer, 3 parallax depth layers -->
        <div id="navy"></div>
        <div class="bgl bg1"></div>
        <div class="bgl bg2"></div>
        <div class="bgl bg3"></div>

        <!-- Pages are generated by js/main.js from js/content.js -->
        <div id="pages"></div>

        <!-- The persistent phone emulator (built by js/emulator.js) -->
        <div id="phone-layer"></div>

        <!-- Shared hand-off element: the T symbol -->
        <img id="tsym" alt="" src="assets/logo/logo-symbol.png">
        <div id="fx"></div>
      </div>

      <!-- Floating overlays (not a header or footer) -->
      <div id="speaker" aria-label="Current speaker"></div>
      <div id="cue" aria-hidden="true"></div>
      <nav id="dots" aria-label="Sections"></nav>
    </main>
  </div>

  <script src="js/content.js"></script>
  <script src="js/emulator.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
